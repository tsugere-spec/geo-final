<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>新地理総合 期末テスト対策</title>
<style> *{box-sizing:border-box}body{margin:0;background:#f1f5f4;color:#17312e;font:16px/1.65 system-ui,sans-serif}main{max-width:700px;margin:auto;padding:22px 16px}header{font-size:12px;letter-spacing:.12em;color:#47736b}h1{font-size:26px;margin:6px 0}h2{font-size:21px;line-height:1.65}section{background:white;border:1px solid #dce7e2;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #17312e08}button,select{font:inherit;border:1px solid #c5d7d0;border-radius:11px;padding:12px;background:white;color:inherit;min-height:48px}button{cursor:pointer}button.primary{background:#17685a;color:white;border-color:#17685a}button:disabled{opacity:.55}select{width:100%;margin:5px 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{width:100%;margin-top:10px}.muted{color:#60736f;font-size:13px}.tag{font-size:13px;color:#17685a;font-weight:700}.answer{background:#e8f5ef;padding:16px;border-radius:12px;margin:12px 0;white-space:pre-wrap}.answer b{font-size:23px}.bar{height:8px;background:#dce7e2;border-radius:10px;overflow:hidden}.bar i{display:block;background:#17685a;height:100%}.choice{display:block;width:100%;text-align:left;margin:8px 0}.good{background:#d4f1df;border-color:#32865b}.bad{background:#fbe3e0;border-color:#b64a42}button:focus-visible{outline:3px solid #e5a64c}footer{font-size:12px;color:#60736f} [hidden]{display:none!important}</style>
<link rel="stylesheet" href="mobile.css">
</head>
<body>
<main>
<h1>新地理総合 期末テスト対策</h1><div class="muted">帝国書院対応・提供ワークをもとにしたオリジナル問題</div>
<section><div id="stats" role="status"></div><progress id="master" aria-label="全問題の習得進捗" max="110" value="0"></progress><p class="muted" id="storage"></p>
<label for="region">出題範囲</label>
<select id="region"><option value="all">全範囲</option><option value="1">西アジア・中央アジア・北アフリカ</option><option value="2">インド・南アジア</option><option value="3">ラテンアメリカ</option><option value="4">アフリカ</option><option value="5">ロシア</option>
</select>
<label for="mode">学習モード</label>
<select id="mode"><option value="flash">一問一答（自己採点）</option><option value="choice">4択</option>
</select>
<label for="difficulty">難易度</label><select id="difficulty"><option value="basic">基礎（重要語句）</option><option value="standard" selected>標準（全110問）</option><option value="advanced">応用（資料・因果関係・紛らわしい語句）</option></select><label><input type="checkbox" id="shuffle" checked> ランダム出題</label>
<label class="check"><input type="checkbox" id="repeat" checked> 全問正解するまで繰り返す</label><div class="grid"><button class="primary" id="start">学習スタート</button><button id="review">苦手だけ復習</button></div><button id="resume" class="wide" hidden>前回の続きから</button>
</section>
<section id="quiz" hidden><div class="tag" id="tag"></div><progress id="progress" aria-label="周回の進捗"></progress>
<h2 id="question" tabindex="-1">
</h2><div id="choices"></div><button class="primary wide" id="reveal">答えを見る</button><div class="answer" id="answer" tabindex="-1" hidden><div id="outcome" class="tag"></div><b id="correct"></b><div id="explain"></div><p id="compare" hidden></p></div><div class="grid" id="grade" hidden><button id="wrong">× もう一度</button><button class="primary" id="right">○ 覚えた</button></div><button id="next" class="primary wide" hidden>次の問題</button>
</section>
<section id="done" tabindex="-1" hidden>
</section>
<footer>統計・協定・BRICSなどはワークの掲載時点に合わせています。学習履歴はこのブラウザ内のみ保存されます。<br><button id="reset" style="margin-top:12px">学習履歴を消去</button>
</footer>
</main>
<script src="questions.js" defer>
</script>
<script src="choices.js" defer></script><script src="app.js" defer>
</script>
</body>
</html>
